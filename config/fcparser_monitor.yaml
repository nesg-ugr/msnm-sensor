---
#-----------------------------------------------------------------------
#
# Monitor- Configuration File
#
#-----------------------------------------------------------------------
#
# tag: tag asociated with the files
#
# structured: Boolean ver to indicate if datasource is structured or not.
#
# timestamp_format: format of the timestamp of the logs in the files of
#                   this dataSource in python datetime format, see https://docs.python.org/2/library/datetime.html#strftime-and-strptime-behavior
#
# timestamp_regexp: regular expresion that matches the date format of the source (only needed for unstructured sources)
#
# separator: chars that delimitates the log entries of the source (only needed in unstructured sources)
#
# timearg: position of the timestamp in the log entry (only needed in structured sources)
#
# VARIABLES:
#   - name:      Variable name.
#     matchtype:      Variable matchtype {string, number, counter, ip, time, duration}.
#     where:       Position of the field in the line (starts with 0).
#
#   - ...
#
# FEATURES:
#   - name:      Feature name.
#     variable:  Feature from which the feature is calculated.
#     matchtype:      Feature matchtype {single, multiple, range, default}
#     value:     Value of the field that defines the feature.
#                If the matchtype is 'single' use a single value.
#                If the matchtype is 'multiple', use a list of values.
#                If the matchtype is 'range', use a list of two values.
#                If the matchtype is 'default', the value must be empty.
#   - ...
#-----------------------------------------------------------------------

tag: monitor

structured: True

timestamp_format: "%Y-%m-%d %H:%M:%S"

# timestamp_regexp:

# separator:

timearg: 0

## Variable Section
VARIABLES:
  - name: mem_available
    matchtype: number
    where: 1
  - name: mem_used
    matchtype: numer
    where: 2
  - name: mem_free
    matchtype: number
    where: 3
  - name: swap_total
    matchtype: number
    where: 4
  - name: swap_used
    matchtype: number
    where: 5
  - name: swap_percent
    matchtype: percentage #TODO ??????????
    where: 6
  - name: disk_used
    matchtype: number
    where: 7
  - name: disk_free
    matchtype: number
    where: 8
  - name: disk_used_percentage
    matchtype: percentage
    where: 9
  - name: counters_read
    matchtype: number
    where: 10
  - name: counters_write
    matchtype: number
    where: 11
  - name: counters_read_bytes
    matchtype: number
    where: 12
  - name: counters_write_bytes
    matchtype: number
    where: 13
  - name: counters_read_time
    matchtype: number
    where: 14
  - name: counters_write_bytes
    matchtype: number
    where: 15
  - name: syscalls_switches
    matchtype: number
    where: 16
  - name: syscalls_interrupts
    matchtype: number
    where: 17
  - name: syscalls_softinterrupts
    matchtype: number
    where: 18
  - name: syscalls_syscalls
    matchtype: number
    where: 19
  - name: cpu_percent
    matchtype: percentage
    where: 20

## Features Section
FEATURES:
  - name: mem_available

  - name: mem_used

  - name: mem_free

  - name: swap_total

  - name: swap_used

  - name: swap_percent

  - name: disk_used

  - name: disk_free

  - name: disk_used_percentage

  - name: counters_read

  - name: counters_write

  - name: counters_read_bytes

  - name: counters_write_bytes

  - name: counters_read_time

  - name: counters_write_bytes

  - name: syscalls_switches

  - name: syscalls_interrupts

  - name: syscalls_softinterrupts

  - name: syscalls_syscalls

  - name: cpu_percent
